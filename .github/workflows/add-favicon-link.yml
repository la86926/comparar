name: Add favicon link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !contains(github.event.head_commit.message, '[favicon-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon reference and clean up workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="icon" type="image/x-icon" href="./favicon.ico">'
          if link not in s:
              needle = '<title>Comparador de Documentos</title>'
              if needle not in s:
                  raise SystemExit('No se encontró el título esperado en index.html')
              s = s.replace(needle, needle + '\n' + link, 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/add-favicon-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-favicon-link.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add favicon link [favicon-done]"
          git push
