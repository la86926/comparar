name: One-time visible counter and performance patch

on:
  push:
    paths:
      - '.github/workflows/one-time-visible-counter-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply counter and performance patch
        run: python3 .github/patch-visible-counter-performance.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve change counter visibility and large text performance"
          git push
