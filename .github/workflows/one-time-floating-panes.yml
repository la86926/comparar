name: One-time floating panes patch

on:
  push:
    paths:
      - '.github/workflows/one-time-floating-panes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply floating panes patch
        run: python3 .github/patch-floating-panes.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use two draggable compact floating text panes"
          git push
