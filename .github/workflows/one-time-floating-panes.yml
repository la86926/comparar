name: One-time floating panes patch

on:
  push:
    paths:
      - '.github/workflows/one-time-floating-panes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert floating editor into draggable panes
        shell: bash
        run: |
          echo '     nCnMgPSBzWzpq c19zdGFydF0gKyBuZXdfanMgKyBzW2pzX2VuZDpdCgpwYXRoLndyaXRlX3RleHQocywgZW5jb2Rpbmc9InV0Zi04IikKcHJpbnQoIkNvbnZlcnRlZCBjb21wYWN0IGJhciBpbnRvIHR3byBkcmFnZ2FibGUgZmxvYXRpbmcgcGFuZXMiKQo=' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use two draggable compact floating text panes"
          git push
