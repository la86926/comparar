name: One-time worker cancellation cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-worker-cancel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply worker cancellation cleanup
        run: python3 .github/patch-worker-cancel.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Cancel superseded large text comparisons cleanly"
          git push
