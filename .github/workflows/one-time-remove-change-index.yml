name: One-time restore original change navigation

on:
  push:
    paths:
      - '.github/workflows/one-time-remove-change-index.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original navigation
        run: python3 .github/remove-change-index.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore original change navigation"
          git push
